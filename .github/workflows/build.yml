name: Build Poké Smart Sort APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          unzip -q PokeSmartSort_GitHub_Build.zip -d source
          test -f source/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
     
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon -p source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: poke-smart-sort-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
